        <h1>PetPal Care Hub</h1>
        <p>
          PetPal Care Hub is a pet-care technology platform for pet owners in Cyprus. Track pets with GPS collars,
          identify them with NFC tags, publish lost-pet alerts, and find pet-friendly places nearby.
        </p>
        <h2>GPS pet tracker</h2>
        <p>
          The PetPal GPS tracker shows live location in the app, with location history and routes. Live tracking
          requires an active PetPal Plus subscription. Hardware is available from €39.99; monthly Plus from €4.99;
          yearly Plus from €89.99 (includes a free NFC tag and discounted tracker on the first year).
        </p>
        <h2>NFC pet ID tags</h2>
        <p>
          NFC tags do not provide live GPS. A finder taps the tag with a smartphone to open the pet’s public digital
          profile and contact options set by the owner. Tags are available from €9.99, or free with Yearly Plus.
        </p>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="PetPal GPS Tracker" />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://maps.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googleapis.com" />
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>PetPal</title>
    <style>
      html,body,#root{margin:0;height:100%;background:linear-gradient(165deg,#f8fafc 0%,#eef2ff 45%,#f8fafc 100%)}
      .pp-boot{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
      .pp-boot__card{width:100%;max-width:440px;background:rgba(255,255,255,.82);border:1px solid rgba(16,24,40,.09);border-radius:20px;padding:28px 24px 26px;box-shadow:0 4px 24px rgba(16,24,40,.06),0 24px 56px rgba(91,55,255,.12);text-align:center}
      .pp-boot__brand{display:flex;align-items:center;justify-content:center;gap:12px}
      .pp-boot__logo{width:44px;height:44px;border-radius:12px}
      .pp-boot__title{font-size:24px;font-weight:900;letter-spacing:-.03em;color:#101828}
      .pp-boot__sub{margin:14px 0 0;color:#475467;font-size:15px;font-weight:650}
      .pp-boot__spin{margin:22px auto 0;width:44px;height:44px;border-radius:50%;border:3px solid rgba(91,55,255,.15);border-top-color:rgba(91,55,255,.92);animation:pp-boot-spin .95s linear infinite}
      @keyframes pp-boot-spin{to{transform:rotate(360deg)}}
    </style>
    <script>
      (function () {
        var path = location.pathname;
        if (path !== '/' && path !== '/index.html') return;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = '/images/home-hero.webp';
        link.type = 'image/webp';
        link.fetchPriority = 'high';
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="pp-boot" role="status" aria-live="polite" aria-label="Loading PetPal">
        <div class="pp-boot__card">
          <div class="pp-boot__brand">
            <img class="pp-boot__logo" src="/logo192.png" width="44" height="44" alt="" />
            <div class="pp-boot__title">PetPal</div>
          </div>
          <p class="pp-boot__sub">Loading…</p>
          <div class="pp-boot__spin" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </body>
</html>

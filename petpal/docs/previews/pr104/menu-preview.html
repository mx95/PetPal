<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview — Menu icons (PR #104)</title>
  <link rel="stylesheet" href="file:///workspace/petpal/src/ui/ui.css" />
  <link rel="stylesheet" href="preview-shell.css" />
</head>
<body>
  <div class="pp-shell">
    <div class="preview-topnav" style="position:relative;">
      <strong>PetPal CARE HUB</strong>
      <span class="preview-menu-btn">Menu ▾</span>
      <div class="preview-menu-open">
        <div class="preview-menu-item"><span>📬</span><span>Inbox</span></div>
        <div class="preview-menu-item"><span>🐾</span><span>My Pets</span></div>
        <div class="preview-menu-item is-highlight">
          <span class="pp-menuActionIcon pp-menuActionIcon--lost">🚨</span>
          <span>Lost Pets</span>
        </div>
        <div class="preview-menu-item is-highlight">
          <span class="pp-menuActionIcon pp-menuActionIcon--shelter">🐾</span>
          <span>Shelters</span>
        </div>
        <div class="preview-menu-item"><span>🏃</span><span>Activity</span></div>
        <div class="preview-menu-item"><span>📅</span><span>Bookings</span></div>
        <div class="preview-menu-item"><span>👤</span><span>My Profile</span></div>
        <div class="preview-menu-item" style="color:#dc2626;"><span>↩️</span><span>Log out</span></div>
      </div>
    </div>
    <div class="pp-main" style="opacity:.35;pointer-events:none;filter:blur(1px);">
      <p class="pp-subtle">Background: Activity hub</p>
      <div class="pp-card pp-pad" style="height:360px;"></div>
    </div>
    <nav class="preview-bottom-nav">
      <div class="preview-bottom-nav__item">Activity</div>
      <div class="preview-bottom-nav__item">Bookings</div>
      <div class="preview-bottom-nav__item is-live">Live</div>
      <div class="preview-bottom-nav__item">Nearby</div>
      <div class="preview-bottom-nav__item">Shop</div>
    </nav>
  </div>
</body>
</html>

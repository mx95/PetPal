<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="30" />
    <title>PetPal — Updating</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #101a35;
        --muted: #64748b;
        --purple: #6546e8;
        --lavender: #eeeafe;
        --bg: #f5f7fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(900px 420px at 100% -10%, rgba(101, 70, 232, 0.12), transparent 70%),
          var(--bg);
        color: var(--ink);
      }

      .card {
        width: min(440px, 100%);
        padding: 32px 28px 28px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(101, 70, 232, 0.12);
        box-shadow: 0 24px 60px rgba(16, 26, 53, 0.12);
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: var(--ink);
      }

      .brand__mark {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #6546e8, #2f80ff);
        color: #fff;
        font-size: 22px;
        line-height: 1;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.45rem, 4vw, 1.75rem);
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
        font-size: 0.98rem;
      }

      .spinner {
        width: 44px;
        height: 44px;
        margin: 22px auto 18px;
        border-radius: 50%;
        border: 4px solid var(--lavender);
        border-top-color: var(--purple);
        animation: spin 0.9s linear infinite;
      }

      .hint {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid rgba(16, 26, 53, 0.08);
        font-size: 0.86rem;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="brand" aria-hidden="true">
        <span class="brand__mark">🐾</span>
        <span>PetPal Care Hub</span>
      </div>
      <div class="spinner" aria-hidden="true"></div>
      <h1>We&rsquo;re updating PetPal</h1>
      <p>
        A new version is being deployed. This usually takes one to three minutes.
        The page will refresh automatically.
      </p>
      <p class="hint">Thank you for your patience.</p>
    </main>
  </body>
</html>

# One-off / refresh: seed TRACKER25 (€39.99 tracker → €25) on production Firebase.
# Run manually: Actions → Seed TRACKER25 discount → Run workflow

name: Seed TRACKER25 discount

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Seed TRACKER25 over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            PETPAL_ROOT="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$PETPAL_ROOT" ]; then PETPAL_ROOT="/root/PetPal"; fi
            cd "$PETPAL_ROOT"
            git fetch origin
            if git rev-parse --verify origin/cursor/tracker25-discount-d742 >/dev/null 2>&1; then
              git checkout -B cursor/tracker25-discount-d742 origin/cursor/tracker25-discount-d742
            else
              git checkout main
              git reset --hard origin/main
            fi
            cd petpal
            export FIREBASE_PROJECT_ID=petpal-aecda
            if [ -f /root/serviceAccount.json ]; then
              export GOOGLE_APPLICATION_CREDENTIALS=/root/serviceAccount.json
            elif [ -f "$PETPAL_ROOT/petpal/serviceAccount.json" ]; then
              export GOOGLE_APPLICATION_CREDENTIALS="$PETPAL_ROOT/petpal/serviceAccount.json"
            fi
            if [ ! -f scripts/seed-tracker25-discount.cjs ]; then
              echo "scripts/seed-tracker25-discount.cjs missing"
              exit 1
            fi
            node scripts/seed-tracker25-discount.cjs

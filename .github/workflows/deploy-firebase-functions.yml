# Deploy JCC / shop Cloud Functions (separate from Hetzner SPA deploy).
#
# Prefer the SSH workflow (Deploy Firebase from server) when FIREBASE_TOKEN is
# not configured. This workflow is optional CI auth via `firebase login:ci`.
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   FIREBASE_TOKEN — CI token from `firebase login:ci` (project: petpal-aecda)
#
# JCC credentials stay in Firebase Functions config on GCP (not in this repo):
#   firebase functions:config:set jcc.user="..." jcc.pass="..." jcc.rest_base="..." jcc.return_url="..." jcc.frontend_url="https://petpal.com.cy"

name: Deploy Firebase shop functions

on:
  push:
    branches:
      - main
    paths:
      - 'petpal/functions/**'
      - 'petpal/firebase.json'
      - 'petpal/.firebaserc'
      - '.github/workflows/deploy-firebase-functions.yml'
  workflow_dispatch:

concurrency:
  # Share with deploy-firebase-from-server.yml so both paths do not race.
  group: deploy-firebase-functions-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check FIREBASE_TOKEN
        id: auth
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_TOKEN is not set — skipping CI token deploy."
            echo "Shop functions are deployed by 'Deploy Firebase from server' instead."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.auth.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.auth.outputs.skip != 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: petpal/functions/package-lock.json

      - name: Install function dependencies
        if: steps.auth.outputs.skip != 'true'
        run: npm ci
        working-directory: petpal/functions

      - name: Deploy shop + subscription functions
        if: steps.auth.outputs.skip != 'true'
        working-directory: petpal
        run: >
          npx firebase-tools@13.29.1 deploy
          --only functions:createJccCheckout,functions:createJccUpdateCard,functions:jccPaymentReturn,functions:billingRenewal,functions:expireProviderBoosts,functions:assignSubscriptionImei,functions:linkTrackerSubscriptionPet,functions:createCustomerBooking,functions:sendBookingConfirmation,functions:submitContactForm,functions:getSupportEmailStatus,functions:saveSupportSmtpConfig,functions:getSitePaymentModeStatus,functions:setSitePaymentMode,functions:saveSiteJccCredentials,functions:bootstrapLiveJccCredentials
          --project petpal-aecda
          --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

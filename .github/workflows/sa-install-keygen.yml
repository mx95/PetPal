# TEMPORARY: step 1 of installing the Firebase service account on the server. Remove after use.
name: SA install - keygen (temporary)

on:
  push:
    branches:
      - cursor/safe-zone-notifications-d742
    paths:
      - '.github/workflows/sa-install-keygen.yml'

jobs:
  keygen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            umask 077
            openssl genrsa -out /root/.sa-install.key 3072 2>/dev/null
            chmod 600 /root/.sa-install.key
            echo "-----PUBLIC KEY BELOW-----"
            openssl rsa -in /root/.sa-install.key -pubout 2>/dev/null
            echo "-----PUBLIC KEY ABOVE-----"

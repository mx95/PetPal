# Push to main → rsync checkout to Hetzner, build SPA, reload PM2 tracker.
#
# Code sync uses rsync from the Actions runner (no git pull on the server), which
# avoids HTTPS credential prompts and concurrent git lock failures.
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      e.g. 116.203.209.68
#   DEPLOY_USER      e.g. root
#   DEPLOY_SSH_KEY   private key (PEM) that can SSH as DEPLOY_USER
# Optional:
#   DEPLOY_PORT      default 22
#   DEPLOY_PATH      default /root/PetPal
#
# One-time setup on the server:
#   1. mkdir -p /root/PetPal && petpal/.env.local with Firebase keys
#   2. cd tracker-tcp-server && pm2 start ecosystem.config.cjs && pm2 save
#   4. Add the GitHub Actions public key to ~/.ssh/authorized_keys

name: Deploy server

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: false
        default: main
      clear_imei:
        description: Optional IMEI — wipe all position history after deploy
        required: false
        default: ''
      places_api_key:
        description: Optional server Places API key (stored on server only, not in git)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: petpal-server-ssh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 1

      - name: Rsync checkout to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_KEY_FILE: ~/.ssh/deploy_key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export DEPLOY_PATH="${DEPLOY_PATH:-/root/PetPal}"
          export DEPLOY_PORT="${DEPLOY_PORT:-22}"
          bash scripts/ci-rsync-to-server.sh

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            PETPAL_ROOT="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$PETPAL_ROOT" ]; then PETPAL_ROOT="/root/PetPal"; fi
            export PETPAL_ROOT
            export DEPLOY_BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
            export CLEAR_DEVICE_POSITIONS_IMEI="${{ github.event.inputs.clear_imei || '' }}"
            printf '%s\n' "${{ github.sha }}" > "$PETPAL_ROOT/.deploy-sha"
            ENVF="$PETPAL_ROOT/petpal/.env.local"
            PLACES_KEY="${{ secrets.GOOGLE_PLACES_API_KEY }}"
            if [ -z "$PLACES_KEY" ] && [ -n "${{ github.event.inputs.places_api_key }}" ]; then
              PLACES_KEY="${{ github.event.inputs.places_api_key }}"
            fi
            if [ -n "$PLACES_KEY" ]; then
              mkdir -p /var/lib/petpal
              printf '%s\n' "$PLACES_KEY" > /var/lib/petpal/places-api-key
              chmod 600 /var/lib/petpal/places-api-key
              if [ -f "$ENVF" ]; then
                if grep -qE '^GOOGLE_PLACES_API_KEY=' "$ENVF"; then
                  sed -i.bak "s|^GOOGLE_PLACES_API_KEY=.*|GOOGLE_PLACES_API_KEY=${PLACES_KEY}|" "$ENVF"
                else
                  printf '\nGOOGLE_PLACES_API_KEY=%s\n' "$PLACES_KEY" >> "$ENVF"
                fi
              fi
              echo "[deploy] GOOGLE_PLACES_API_KEY configured on server (not in git)"
            fi
            AUTH_DOMAIN="${PETPAL_FIREBASE_AUTH_DOMAIN:-petpal.com.cy}"
            if [ -f "$ENVF" ]; then
              if grep -qE '^REACT_APP_FIREBASE_AUTH_DOMAIN=' "$ENVF"; then
                sed -i.bak "s|^REACT_APP_FIREBASE_AUTH_DOMAIN=.*|REACT_APP_FIREBASE_AUTH_DOMAIN=${AUTH_DOMAIN}|" "$ENVF"
              else
                printf '\nREACT_APP_FIREBASE_AUTH_DOMAIN=%s\n' "$AUTH_DOMAIN" >> "$ENVF"
              fi
              echo "[deploy] REACT_APP_FIREBASE_AUTH_DOMAIN=${AUTH_DOMAIN}"
            fi
            export SKIP_GIT=1
            export PETPAL_FIREBASE_AUTH_DOMAIN="$AUTH_DOMAIN"
            bash "$PETPAL_ROOT/scripts/deploy-server.sh"
            CLEAR_INBOX_MARKER="/var/lib/petpal/broadcast-inbox-cleared-2026-08-21b"
            CLEAR_INBOX_SCRIPT="$PETPAL_ROOT/petpal/scripts/clear-broadcast-inbox.cjs"
            rm -f /var/lib/petpal/broadcast-inbox-cleared-2026-08-21 2>/dev/null || true
            if [ -f "$CLEAR_INBOX_SCRIPT" ] && [ ! -f "$CLEAR_INBOX_MARKER" ]; then
              echo "[deploy] Clearing broadcast inbox (post-deploy one-shot)"
              mkdir -p /var/lib/petpal
              export FIREBASE_PROJECT_ID=petpal-aecda
              if [ -f /root/serviceAccount.json ]; then
                export GOOGLE_APPLICATION_CREDENTIALS=/root/serviceAccount.json
              elif [ -f "$PETPAL_ROOT/petpal/serviceAccount.json" ]; then
                export GOOGLE_APPLICATION_CREDENTIALS="$PETPAL_ROOT/petpal/serviceAccount.json"
              fi
              if (cd "$PETPAL_ROOT/petpal" && node scripts/clear-broadcast-inbox.cjs); then
                touch "$CLEAR_INBOX_MARKER"
                echo "[deploy] Broadcast inbox cleared OK"
              else
                echo "[deploy] clear-broadcast-inbox.cjs failed — trying firebase CLI delete"
                if command -v firebase >/dev/null 2>&1; then FB=firebase; else FB="npx firebase-tools@13.29.1"; fi
                if (cd "$PETPAL_ROOT/petpal" && $FB firestore:delete broadcastMessages --recursive --force --project petpal-aecda --non-interactive); then
                  touch "$CLEAR_INBOX_MARKER"
                  echo "[deploy] Broadcast inbox cleared via Firebase CLI OK"
                else
                  echo "[deploy] Broadcast inbox clear skipped or failed (Admin credentials may be missing)"
                fi
              fi
            fi
            SHELTER_SEED_MARKER="/var/lib/petpal/shelter-pending-seeded-2026-08-27"
            SHELTER_SEED_SCRIPT="$PETPAL_ROOT/petpal/scripts/create-shelter-pending.cjs"
            if [ -f "$SHELTER_SEED_SCRIPT" ] && [ ! -f "$SHELTER_SEED_MARKER" ]; then
              echo "[deploy] Seeding pending demo shelter (post-deploy one-shot)"
              mkdir -p /var/lib/petpal
              export FIREBASE_PROJECT_ID=petpal-aecda
              export SHELTER_EMAIL=shelter.demo@petpal.com.cy
              export SHELTER_PASSWORD='PetPalShelter2026!Demo'
              export SHELTER_NAME='Limassol Paw Rescue'
              if [ -f /root/serviceAccount.json ]; then
                export GOOGLE_APPLICATION_CREDENTIALS=/root/serviceAccount.json
              elif [ -f "$PETPAL_ROOT/petpal/serviceAccount.json" ]; then
                export GOOGLE_APPLICATION_CREDENTIALS="$PETPAL_ROOT/petpal/serviceAccount.json"
              fi
              if (cd "$PETPAL_ROOT/petpal" && node scripts/create-shelter-pending.cjs); then
                touch "$SHELTER_SEED_MARKER"
                echo "[deploy] Pending shelter seeded OK"
              else
                echo "[deploy] Pending shelter seed skipped or failed (Admin credentials may be missing on server)"
              fi
            fi
            CLEAR_IMEI="${CLEAR_DEVICE_POSITIONS_IMEI:-}"
            if [ -n "$CLEAR_IMEI" ]; then
              TRACKER_DB="${PETPAL_TRACKER_DB:-/var/lib/petpal/petpal.sqlite}"
              echo "[deploy] Clearing positions for IMEI $CLEAR_IMEI (post-deploy)"
              (cd "$PETPAL_ROOT/tracker-tcp-server" && SQLITE_PATH="$TRACKER_DB" node scripts/clear-imei-positions.js --imei "$CLEAR_IMEI")
              (cd "$PETPAL_ROOT/tracker-tcp-server" && pm2 restart tracker)
            fi

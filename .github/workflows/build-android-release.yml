name: Build Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'petpal/**'
      - 'mobile-android/**'
      - '.github/workflows/build-android-release.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: petpal/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies & sync Capacitor
        working-directory: petpal
        run: |
          npm ci
          npm run build:mobile

      - name: Write local.properties
        working-directory: mobile-android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

      - name: Build signed App Bundle
        working-directory: mobile-android
        run: chmod +x gradlew scripts/build-release.sh && ./scripts/build-release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: petpal-android-release
          path: mobile-android/releases/*.aab
          if-no-files-found: error

      - name: Commit AAB to releases/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-android/releases/*.aab
          if git diff --staged --quiet; then
            echo "No AAB changes to commit"
          else
            git commit -m "ci: update Android release bundle"
            git push
          fi

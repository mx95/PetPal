# One-off: disable the seeded demo business so it no longer appears in Bookings / Nearby.
# Run manually: Actions → Disable demo business → Run workflow

name: Disable demo business

on:
  workflow_dispatch:
    inputs:
      delete_demo:
        description: Also delete Auth user and Firestore docs (1 = yes)
        required: false
        default: '0'

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Disable demo business over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            PETPAL_ROOT="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$PETPAL_ROOT" ]; then PETPAL_ROOT="/root/PetPal"; fi
            cd "$PETPAL_ROOT"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            cd petpal
            export FIREBASE_PROJECT_ID=petpal-aecda
            export BIZ_EMAIL=business.demo@petpal.com.cy
            export DELETE_DEMO="${{ github.event.inputs.delete_demo || '0' }}"
            if [ -f /root/serviceAccount.json ]; then
              export GOOGLE_APPLICATION_CREDENTIALS=/root/serviceAccount.json
            elif [ -f "$PETPAL_ROOT/petpal/serviceAccount.json" ]; then
              export GOOGLE_APPLICATION_CREDENTIALS="$PETPAL_ROOT/petpal/serviceAccount.json"
            fi
            node scripts/disable-demo-business.cjs

# TEMPORARY: step 2 of installing the Firebase service account on the server. Remove after use.
# The payload is encrypted to a one-time key that exists only on the server and is deleted afterwards.
name: SA install - apply (temporary)

on:
  push:
    branches:
      - cursor/safe-zone-notifications-d742
    paths:
      - '.github/workflows/sa-install-apply.yml'
      - '.github/sa-install/**'

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Load encrypted payload
        run: |
          echo "SA_PAYLOAD=$(cat .github/sa-install/payload.b64)" >> "$GITHUB_ENV"
          echo "SA_PASS=$(cat .github/sa-install/pass.b64)" >> "$GITHUB_ENV"
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            umask 077
            [ -f /root/.sa-install.key ] || { echo "one-time key missing"; exit 1; }
            T=$(mktemp -d)
            echo '${{ env.SA_PASS }}' | base64 -d > "$T/pass.enc"
            echo '${{ env.SA_PAYLOAD }}' | base64 -d > "$T/payload.enc"
            openssl pkeyutl -decrypt -inkey /root/.sa-install.key -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$T/pass.enc" -out "$T/pass.txt"
            openssl enc -d -aes-256-cbc -pbkdf2 -pass file:"$T/pass.txt" -in "$T/payload.enc" -out "$T/sa.json"
            node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(j.type!=="service_account"||!j.private_key||j.project_id!=="petpal-aecda") process.exit(2); console.log("decrypted OK for", j.client_email)' "$T/sa.json"
            install -m 600 -o root -g root "$T/sa.json" /root/serviceAccount.json
            shred -u "$T"/* 2>/dev/null || rm -f "$T"/*
            rmdir "$T"
            shred -u /root/.sa-install.key 2>/dev/null || rm -f /root/.sa-install.key
            echo "-- result --"
            stat -c '%n %a %U %s bytes' /root/serviceAccount.json
            ls /root/.sa-install.key 2>/dev/null && echo "WARNING: one-time key still present" || echo "one-time key removed"

# TEMPORARY: read-only check that the Firebase service account exists on the server. Remove after use.
name: Check service account (temporary)

on:
  push:
    branches:
      - cursor/safe-zone-notifications-d742
    paths:
      - '.github/workflows/check-service-account.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect server (no secrets printed)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -u
            ROOT="${{ secrets.DEPLOY_PATH }}"; [ -z "$ROOT" ] && ROOT=/root/PetPal
            for f in /root/serviceAccount.json "$ROOT/petpal/serviceAccount.json"; do
              if [ -f "$f" ]; then
                echo "FOUND $f ($(stat -c '%a %U %s bytes, modified %y' "$f"))"
                node -e '
                  const j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                  console.log("  type=" + j.type + " project_id=" + j.project_id + " client_email=" + j.client_email);
                  console.log("  has_private_key=" + Boolean(j.private_key));
                ' "$f" || echo "  (could not parse JSON)"
              else
                echo "MISSING $f"
              fi
            done
            echo "-- GOOGLE_APPLICATION_CREDENTIALS in pm2 tracker env --"
            pm2 jlist 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                try {
                  const t = JSON.parse(s).find(p => p.name === "tracker");
                  console.log(t ? (t.pm2_env.GOOGLE_APPLICATION_CREDENTIALS || "(not set)") : "tracker app not found");
                } catch (e) { console.log("pm2 not readable"); }
              });'
            echo "-- node / disk for alerts state dir --"
            node -v; ls -ld /var/lib/petpal 2>/dev/null || echo "/var/lib/petpal missing"
            echo "-- firebase-admin installed on server? --"
            ls -d "$ROOT/tracker-tcp-server/node_modules/firebase-admin" 2>/dev/null || echo "not installed yet (expected before merge)"

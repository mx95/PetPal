# TEMPORARY: step 2 of installing the Places key on the server. Remove after use.
name: PK install - apply (temporary)
on:
  push:
    branches: [cursor/safe-zone-notifications-d742]
    paths: ['.github/workflows/pk-install-apply.yml', '.github/pk-install/**']
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Load encrypted payload
        run: |
          echo "PK_PAYLOAD=$(cat .github/pk-install/payload.b64)" >> "$GITHUB_ENV"
          echo "PK_PASS=$(cat .github/pk-install/pass.b64)" >> "$GITHUB_ENV"
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            umask 077
            [ -f /root/.pk-install.key ] || { echo "one-time key missing"; exit 1; }
            T=$(mktemp -d)
            echo '${{ env.PK_PASS }}' | base64 -d > "$T/pass.enc"
            echo '${{ env.PK_PAYLOAD }}' | base64 -d > "$T/payload.enc"
            openssl pkeyutl -decrypt -inkey /root/.pk-install.key -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$T/pass.enc" -out "$T/pass.txt"
            openssl enc -d -aes-256-cbc -pbkdf2 -pass file:"$T/pass.txt" -in "$T/payload.enc" -out "$T/key.txt"
            LEN=$(tr -d '\r\n' < "$T/key.txt" | wc -c)
            case "$(head -c 4 "$T/key.txt")" in AIza) ;; *) echo "decrypted value is not a Google API key"; exit 2;; esac
            [ "$LEN" -eq 39 ] || { echo "unexpected key length $LEN"; exit 2; }
            mkdir -p /var/lib/petpal
            install -m 600 -o root -g root "$T/key.txt" /var/lib/petpal/places-api-key
            shred -u "$T"/* 2>/dev/null || rm -f "$T"/*
            rmdir "$T"
            shred -u /root/.pk-install.key 2>/dev/null || rm -f /root/.pk-install.key
            echo "-- result --"
            stat -c '%n %a %U %s bytes' /var/lib/petpal/places-api-key
            echo "decrypted OK, length $LEN, prefix AIza"
            ls /root/.pk-install.key 2>/dev/null && echo "WARNING: one-time key still present" || echo "one-time key removed"

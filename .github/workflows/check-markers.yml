# TEMPORARY read-only: list one-time deploy markers. Remove after use.
name: Check markers (temporary)
on:
  push:
    branches: [cursor/safe-zone-notifications-d742]
    paths: ['.github/workflows/check-markers.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "== /var/lib/petpal =="
            ls -la --time-style=long-iso /var/lib/petpal | awk '{print $6, $7, $8}'
            ROOT="${{ secrets.DEPLOY_PATH }}"; [ -z "$ROOT" ] && ROOT=/root/PetPal
            echo "places key file: $([ -s /var/lib/petpal/places-api-key ] && echo present || echo absent)"
            echo "places key in .env.local: $(grep -qE '^GOOGLE_PLACES_API_KEY=.+' "$ROOT/petpal/.env.local" 2>/dev/null && echo present || echo absent)"
            echo "firebase CLI login on server: $(npx --yes firebase-tools@13.29.1 projects:list --non-interactive >/dev/null 2>&1 && echo yes || echo no)"

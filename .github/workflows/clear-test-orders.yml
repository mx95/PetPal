# One-off: delete test shop orders/payments, keep the real customer order,
# and backfill NFC design onto that kept order when recoverable.
# Run manually: Actions → Clear test shop orders → Run workflow

name: Clear test shop orders

on:
  workflow_dispatch:
    inputs:
      keep_order_id:
        description: 'Order id to keep (all other recent orders are deleted)'
        required: true
        default: 'PP-1787406430913-ivctd7'
      dry_run:
        description: 'Set to 1 to list deletions without writing'
        required: false
        default: '0'

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clear test orders over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            PETPAL_ROOT="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$PETPAL_ROOT" ]; then PETPAL_ROOT="/root/PetPal"; fi
            cd "$PETPAL_ROOT"
            git fetch origin
            # Prefer branch that contains the clear script; fall back to main after merge.
            if git rev-parse --verify origin/cursor/admin-orders-nfc-design-d742 >/dev/null 2>&1; then
              git checkout -B cursor/admin-orders-nfc-design-d742 origin/cursor/admin-orders-nfc-design-d742
            else
              git checkout main
              git reset --hard origin/main
            fi
            cd petpal
            export FIREBASE_PROJECT_ID=petpal-aecda
            export KEEP_ORDER_ID='${{ github.event.inputs.keep_order_id }}'
            export DRY_RUN='${{ github.event.inputs.dry_run }}'
            if [ -f /root/serviceAccount.json ]; then
              export GOOGLE_APPLICATION_CREDENTIALS=/root/serviceAccount.json
            elif [ -f "$PETPAL_ROOT/petpal/serviceAccount.json" ]; then
              export GOOGLE_APPLICATION_CREDENTIALS="$PETPAL_ROOT/petpal/serviceAccount.json"
            fi
            if [ ! -f scripts/clear-test-orders.cjs ]; then
              echo "scripts/clear-test-orders.cjs missing"
              exit 1
            fi
            node scripts/clear-test-orders.cjs
